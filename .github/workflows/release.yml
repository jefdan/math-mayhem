# Publishes a GitHub Release for every Date-Ver tag.
#
# Versioning: Date-Ver (https://date-ver.com/) at day granularity, for example
# 2026.11.24, with an optional sequence number for a second release on the same
# day (2026.11.24.1). `mod_version` in gradle.properties is authoritative and the
# pushed tag must be the identical string; this workflow fails before building
# anything if the two disagree. See "Releasing" in CONTRIBUTING.md.
name: Release

on:
  push:
    # DateVer tags begin with the year, so ad-hoc tags (wip, backup, ...) never
    # publish a release.
    tags:
      - "20*"

# Read-only by default; only the release job opts into writing releases.
permissions:
  contents: read

# Never let two runs publish the same tag at once, and never cancel a run that
# is part-way through uploading assets.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      # The mod compiles with `options.release = 25` and fabric.mod.json
      # declares `java >=25`, so Gradle itself runs on JDK 25 here.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Caches the Gradle wrapper distribution, the dependency cache and
      # Loom's Minecraft artefacts. The first run for a new Minecraft or Loom
      # version pays the download cost; later runs do not.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches mod_version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | head -n 1)"

          if [ -z "$version" ]; then
            echo "::error file=gradle.properties::mod_version is missing or empty."
            exit 1
          fi

          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match mod_version '$version' in gradle.properties."
            echo "Set mod_version='$tag' in gradle.properties, commit that change, and re-tag."
            exit 1
          fi

          # Date-Ver, day granularity: YYYY.MM.DD, optionally followed by a
          # sequence number for a second release that day. Rule 5 forbids
          # leading zeros in appended numeric identifiers.
          if ! printf '%s' "$version" | grep -Eq '^20[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.[1-9][0-9]*)?$'; then
            echo "::error::'$version' is not Date-Ver YYYY.MM.DD (optional .N sequence)."
            echo "Use the UTC release date, for example 2026.11.24, or 2026.11.24.1."
            exit 1
          fi

          # Rule 4: the date must exist. GNU date rejects 2026-02-31.
          datepart="${version:0:10}"
          if ! date -u -d "${datepart//./-}" +%Y-%m-%d >/dev/null 2>&1; then
            echo "::error::'$version' is not a real calendar date."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `build` runs the JUnit suite via `check`, so a failing test blocks the
      # release before any release object is created.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Stage release assets
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          base="$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r' | head -n 1)"

          mkdir -p dist

          # Gradle names these from `version`; see build.gradle.
          cp "build/libs/${base}-${version}.jar" dist/
          cp "build/libs/${base}-${version}-sources.jar" dist/

          # The dev agent jar has a fixed filename in build.gradle, so give the
          # published asset an explicit version.
          cp build/agent/mathmayhem-agent.jar "dist/mathmayhem-agent-${version}.jar"

          ( cd dist && sha256sum ./*.jar > SHA256SUMS.txt )

          echo "Staged assets:"
          ls -l dist

      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          base="$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r' | head -n 1)"
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r' | head -n 1)"
          loader="$(sed -n 's/^loader_version=//p' gradle.properties | tr -d '\r' | head -n 1)"
          api="$(sed -n 's/^fabric_api_version=//p' gradle.properties | tr -d '\r' | head -n 1)"

          # Use the "## <version>" section of CHANGELOG.md as the notes.
          # Match the heading exactly, or with trailing text after a space, so a
          # "## 2026.11.24.1" entry can never be mistaken for "## 2026.11.24".
          awk -v heading="## ${version}" '
            { sub(/\r$/, "") }
            $0 == heading || index($0, heading " ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md || true

          # Trim the blank lines around the section so it joins the footer
          # cleanly, then fall back to a bare heading when no entry exists.
          sed -i -e '/./,$!d' -e '${/^$/d;}' notes.md

          if [ ! -s notes.md ]; then
            echo "::warning::No '## ${version}' section in CHANGELOG.md; release notes will only contain the compatibility block."
            echo "## ${version}" > notes.md
            echo >> notes.md
          fi

          cat >> notes.md <<EOF

          ---

          ### Compatibility

          - Minecraft **${mc}** (Fabric)
          - Fabric Loader **${loader}** or newer
          - Fabric API **${api}**
          - Java **25** or newer

          ### Installation

          Drop ${base}-${version}.jar into the mods folder and start the game once.
          The worldgen fallback works immediately.

          The same jar is also a JVM agent. To enable **All game math**, add this
          to the launch profile's JVM arguments:

              -javaagent:/absolute/path/to/mods/${base}-${version}.jar

          Without the agent the mod runs in the crash-resistant **Safe Worldgen**
          mode.

          > **Back up your worlds.** This mod corrupts worlds by design. Press
          > **F7** in game to restore normal arithmetic at any time.

          Built from commit ${{ github.sha }}.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating assets and notes."
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file notes.md \
              dist/*
          fi
