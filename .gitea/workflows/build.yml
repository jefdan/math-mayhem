name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Change this label if your Gitea runner uses a different one.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      # Gitea serves the v3 artifact protocol. upload-artifact v4+ refuses
      # non-GitHub servers, so keep this on v3 for Gitea Actions.
      - name: Upload jars
        uses: actions/upload-artifact@v3
        with:
          name: mathmayhem-jars
          path: |
            build/libs/mathmayhem-*.jar
            build/agent/mathmayhem-agent.jar
          if-no-files-found: error
