# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / Fabric (latest stable as of 2026-11-12)
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.165.2+26.3

# Mod
# Versioning: Date-Ver (https://date-ver.com/), day granularity.
#
# Format: YYYY.MM.DD in UTC, always zero-padded, e.g. 2026.11.24. This value is
# authoritative. The Git tag for a release MUST be the identical string, and CI
# refuses to release when the two disagree.
#
# Stamp it at release time with:
#     date -u +%Y.%m.%d
#
# A second release on the same day takes a sequence number, as Date-Ver
# prescribes: 2026.11.24.1, then 2026.11.24.2. Those identifiers must not have
# leading zeros, so never write 2026.11.24.01.
mod_version=2026.11.24
maven_group=com.mathmayhem
archives_base_name=mathmayhem

# Build tooling
asm_version=9.10.1
junit_version=5.13.4
